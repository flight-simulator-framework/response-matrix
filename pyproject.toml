[project]
name = "flight-response-matrix"
version = "0.2.0"
description = "Offline response matrix reconstruction from recorded machine snapshots."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "machine-interfaces>=0.2.0,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["response_matrix", "ComputeResponseMatrix_GUI.py", "ComputeResponseMatrix_QM_GUI.py"]

[tool.flight-simulator.migration]
status = "package-registry"
