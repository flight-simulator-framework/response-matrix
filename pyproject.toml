[project]
name = "flight-response-matrix"
version = "0.1.0"
description = "Offline response matrix reconstruction from recorded machine snapshots."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "machine-interfaces @ git+https://gitlab.cern.ch/flight-simulator/machine-interfaces.git@1fa7fca06f949e085353030f59587a68de7e3baf"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "response_matrix"}, {include = "ComputeResponseMatrix_GUI.py"}, {include = "ComputeResponseMatrix_QM_GUI.py"}, {include = "ComputeResponseMatrix_rnd_GUI.py"}]

[tool.flight-simulator.migration]
status = "local-execution-ready"
repository-dependencies = ["machine-interfaces"]
